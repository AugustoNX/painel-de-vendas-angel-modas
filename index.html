<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<title>Angel Modas — Painel de Metas</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js" defer></script>
</head>
<body>

<div class="wrap" id="appShell" style="display:none;">
  <header class="top">
    <div class="brand">
      <div class="brand-mark"><img src="assets/logo.png" alt="Logo Angel Modas"></div>
      <div class="brand-text">
        <div class="brand-name">ANGEL</div>
        <div class="brand-handle">@lojaangelmodas</div>
      </div>
    </div>
    <div class="top-right" id="sessionBox"></div>
  </header>

  <p class="subtitle-row" id="subtitle"></p>

  <div class="app-layout">
    <nav class="sidebar" id="sidebarNav"></nav>
    <main class="main-content">
      <section id="viewVendas"></section>
      <section id="viewCarteira" style="display:none;"></section>
      <section id="viewCompras" style="display:none;"></section>
      <section id="viewEquipe" style="display:none;"></section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="loginOverlay"></div>
<div id="modalRoot"></div>
<div id="saleFab"></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
